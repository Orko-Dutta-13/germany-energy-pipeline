name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest dbt-core dbt-duckdb pyyaml

      - name: Lint with flake8
        run: |
          flake8 dags/ plugins/ forecasting/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,E241,E221,F401 \
            --exclude=__pycache__

      - name: Validate DAG Python syntax
        run: |
          python -m py_compile dags/ingestion_dag.py
          python -m py_compile dags/transformation_dag.py
          python -m py_compile dags/forecasting_dag.py
          python -m py_compile plugins/hooks/smard_hook.py
          python -m py_compile plugins/operators/smard_to_postgres_operator.py
          python -m py_compile forecasting/prophet_model.py
          echo "All Python files compile successfully"

      - name: Validate dbt project structure
        working-directory: dbt
        run: |
          python -c "
          import yaml, os, sys

          # Check dbt_project.yml is valid YAML
          with open('dbt_project.yml') as f:
              project = yaml.safe_load(f)
          assert 'name' in project, 'Missing project name'
          assert 'models' in project, 'Missing models config'
          print(f'dbt project: {project[\"name\"]} — OK')

          # Check all model SQL files exist
          required = [
              'models/staging/stg_generation.sql',
              'models/staging/stg_consumption.sql',
              'models/staging/stg_prices.sql',
              'models/marts/mart_generation_by_source.sql',
              'models/marts/mart_daily_demand.sql',
              'models/marts/mart_renewable_share.sql',
              'macros/generate_schema_name.sql',
          ]
          for path in required:
              assert os.path.exists(path), f'Missing: {path}'
              print(f'  OK: {path}')
          print('All dbt model files present')
          "

      - name: Check required files exist
        run: |
          python -c "
          import os
          required = [
              'docker-compose.yml',
              'Dockerfile',
              '.env.example',
              '.gitignore',
              'scripts/init_db.sql',
              'dashboard/Dockerfile',
              'dashboard/app.py',
              '.github/workflows/ci.yml',
          ]
          for path in required:
              assert os.path.exists(path), f'Missing required file: {path}'
              print(f'  OK: {path}')
          print('All required files present')
          "

      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short || true
