# dbt_project.yml
# ────────────────
# This is the main config file for the dbt project.
# It tells dbt: project name, which folder models live in,
# and what materialisation strategy to use per layer.

name: germany_energy
version: '1.0.0'
config-version: 2

profile: germany_energy   # must match the name in profiles.yml

# Folder layout dbt expects
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# What dbt puts in target/ (compiled SQL, run artifacts) — gitignored
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  germany_energy:

    # Staging layer: one model per raw table, minimal transformation
    # Materialised as VIEWS — they're cheap to recompute and always fresh
    staging:
      +materialized: view
      +schema: staging      # writes to postgres schema: staging

    # Mart layer: aggregated, analysis-ready tables
    # Materialised as TABLES — pre-computed so dashboards load fast
    marts:
      +materialized: table
      +schema: analytics    # writes to postgres schema: analytics
